<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Horu's Ocarina</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Noto+Music&amp;family=Spectral:wght@400;600;700&amp;display=swap"><style id="app-style">
/* Layout: paneles marrón oscuro con marco dorado; cada canción es un pentagrama donde la altura del botón indica la nota */
:root{
  --bg:#0e1a12; --panel:#13241a; --panel-2:#1a2e21; --gold:#c8963e; --gold-soft:#8a6730;
  --cream:#f6ead1; --ink-dark:#2a1a0f; --text:#f1e4c8; --muted:#bfa983; --line:#6b5338; --danger:#e58a6c;
  --display:"Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Spectral", Georgia, "Times New Roman", serif;
  --staff-bg:var(--panel);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg) radial-gradient(ellipse at 50% -10%,#21402c 0,transparent 60%) no-repeat;color:var(--text);font-family:var(--body);font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 120px;display:grid;gap:26px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.frame{position:relative;border:2px solid var(--gold);border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px rgba(200,150,62,.25)}
.tab{position:absolute;top:0;left:50%;transform:translate(-50%,-55%);background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:5px 22px;font-family:var(--display);font-size:clamp(17px,2.6vw,22px);white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
.tab::before,.tab::after{content:"";position:absolute;top:50%;width:9px;height:9px;border:2px solid var(--gold);background:var(--bg);transform:translateY(-50%) rotate(45deg)}
.tab::before{left:-7px}.tab::after{right:-7px}

header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-top:12px}
h1{font-size:clamp(28px,5vw,42px);color:var(--cream)}
.tools{display:flex;flex-wrap:wrap;gap:10px}
input[type=search],input[type=text]{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:9px 12px;min-width:0}
input::placeholder{color:var(--muted)}
button{font:inherit;font-size:15px;cursor:pointer;color:var(--cream);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
button.primary{background:var(--gold);color:var(--ink-dark);border-color:var(--gold);font-weight:700}
button.danger{color:var(--danger)}

/* Guía */
.guide-d>summary{display:none}
.guide{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.guide .frame{padding:20px 22px}
.guide h2{font-size:21px;color:var(--cream);margin-bottom:14px}
.g-cols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px}
@media (min-width:900px){.g-cols{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}.g-row{flex-wrap:nowrap;gap:0}.g-row>.g-item{flex:1 1 0;min-width:0}}
.g-cols>div+div{border-left:1px solid var(--gold-soft);padding-left:22px}
.g-row{display:flex;flex-wrap:wrap;gap:16px 18px}
.g-item{display:grid;justify-items:center;gap:8px;text-align:center;font-size:14px;color:var(--text)}
.g-item small{display:block;color:var(--muted);font-size:12.5px}
.howto p{margin:0;line-height:1.55;color:var(--text);max-width:42ch}
@media (max-width:860px){.guide{grid-template-columns:1fr}}
@media (max-width:560px){.g-cols{grid-template-columns:1fr}.g-cols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--gold-soft);padding-top:18px}}

/* Iconos */
.k{display:grid;place-items:center;background:var(--cream);color:var(--ink-dark);font-family:var(--display);font-size:22px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.45)}
.k.face{width:44px;height:44px;border-radius:50%}
.k.sh{width:52px;height:38px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:6px}
.k.big.face{width:56px;height:56px;font-size:28px}
.k.big.sh{width:66px;height:46px;font-size:26px}
.ic-ring{fill:none;stroke:var(--cream);stroke-width:2}
.ic-on{fill:var(--cream)}
.ic-tri{fill:var(--ink-dark)}
.ic-key{fill:var(--cream);stroke:var(--ink-dark);stroke-width:1}
.ic-letter{fill:var(--ink-dark);font-family:var(--display);font-size:13px}
.ic-bend-o{fill:none;stroke:var(--ink-dark);stroke-width:5.4;stroke-linecap:round}
.ic-bend{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round}
.ic-arrow{fill:var(--cream);stroke:var(--ink-dark);stroke-width:1.2;stroke-linejoin:round}

/* Pentagrama */
.songs{display:grid;gap:36px}
.song{padding:34px 18px 16px}
.song-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tag{color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:0 7px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.staffs{display:grid;gap:14px}
.staff-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.staff{position:relative;height:262px;min-width:100%;width:max-content;padding:0 30vw 0 0}
.clef{position:relative;flex:none;width:76px;height:100%;pointer-events:none}
.clef svg{display:block;overflow:visible}
.col,.bar{z-index:1}
.clef .cl-ln{stroke:var(--line);stroke-width:3}
.clef .cl-g{fill:var(--cream);font-family:"Noto Music","Bravura","Segoe UI Symbol","Apple Symbols",serif;font-size:112px}
.ledger{position:absolute;left:50%;transform:translate(-50%,-50%);width:66px;height:3px;border-radius:2px;background:var(--line)}
.speed{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 12px;border:1px solid var(--gold-soft);border-radius:10px;background:var(--panel-2)}
.speed input{accent-color:var(--gold);width:120px}
.speed{padding:4px 6px 4px 12px;gap:6px}
.speed button{padding:2px 10px;font-size:17px;line-height:1.2}
.ver{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,calc(env(safe-area-inset-left,0px) + 14px));color:var(--gold);font-family:var(--display);font-size:12px;letter-spacing:.06em;opacity:.85;pointer-events:none}
body.land .ver{display:none}
.vol{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--gold-soft);border-radius:10px;background:var(--panel-2)}
.vol button{padding:2px 10px;font-size:17px;line-height:1.2}
.vol .snd{display:grid;place-items:center;padding:3px 7px;border:0;background:transparent;color:var(--gold)}
.vol .snd[aria-pressed="false"]{color:var(--muted)}
.vol output{color:var(--cream);min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.speed output{min-width:9ch;text-align:center}
.speed output{color:var(--cream);font-variant-numeric:tabular-nums;min-width:7ch}
.staff .ln{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line) 4%,var(--line) 96%,transparent)}
.notes{position:relative;display:flex;gap:10px;height:100%;align-items:stretch}
.col{position:relative;width:52px;flex:none}
.col .nm{position:absolute;top:214px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:14px;line-height:1;color:var(--muted);padding:4px 8px;border:1px solid rgba(138,103,48,.55);border-radius:6px;background:rgba(0,0,0,.18);opacity:.85;transition:color .2s ease,border-color .2s ease,opacity .2s ease;pointer-events:none}
.col.on .nm{color:var(--cream);border-color:var(--gold);opacity:1}
.col .k.face{width:35px;height:35px;font-size:18px}
.col .k.sh{width:42px;height:30px;font-size:17px}
.col .mods svg{width:29px;height:29px}
.col .mods{gap:1px}
.col .k{position:absolute;left:50%;transform:translate(-50%,-50%)}
.col .mods{position:absolute;left:50%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.col .rm{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:24px;height:24px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--danger)}
.bar.phr{width:8px;background:linear-gradient(90deg,var(--gold-soft) 0 2px,transparent 2px 4px,var(--gold) 4px 8px)}
.bar{width:2px;flex:none;align-self:flex-start;height:118px;margin-top:67px;background:var(--gold-soft);border-radius:2px;position:relative}
.bar .rm{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);width:24px;height:24px;padding:0;border-radius:50%;font-size:15px;line-height:1;display:grid;place-items:center;color:var(--danger)}
.empty{color:var(--muted);font-style:italic;margin:6px 0}

/* Editor */
.editor{padding:34px 20px 20px;border-width:3px;display:grid;gap:18px}
.ed-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-head input{flex:1 1 220px;font-family:var(--display);font-size:22px}
.ed-staff{--staff-bg:var(--panel-2);background:var(--panel-2);border-radius:12px;padding:6px 0 30px}
.builder{display:grid;gap:14px}
.field{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.lbl{font-family:var(--display);color:var(--muted);font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{display:grid;place-items:center;min-width:58px;min-height:58px;padding:6px;border-radius:12px;background:var(--panel-2)}
.pick[aria-pressed="true"]{border-color:var(--cream);background:#244531;box-shadow:0 0 0 2px var(--gold)}
.pick .k{transform:scale(.82)}
.pick small{font-size:12px;color:var(--muted)}
.preview-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--gold-soft);padding-top:16px}
.preview{display:flex;align-items:center;gap:12px;color:var(--muted)}
.pv{position:relative;width:62px;height:104px}
.pv .k{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}
.pv .mods{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.modes{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));display:flex;gap:2px;padding:4px;border:1px solid var(--gold-soft);border-radius:999px;background:rgba(9,19,12,.88);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.modes a{color:var(--muted);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.modes a:hover{color:var(--cream)}
.modes a[aria-current="page"]{background:var(--gold);color:var(--ink-dark);font-weight:700}
.modes a:focus-visible,.mode-card:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.view .wrap{padding-top:64px}
.hero{display:grid;gap:10px;text-align:center;padding-top:20px}
.hero h1{font-size:clamp(32px,6vw,54px)}
.lead{margin:0 auto;color:var(--muted);max-width:56ch;line-height:1.5}
.home{position:relative}
.scenery{position:fixed;left:0;right:0;bottom:0;height:46vh;pointer-events:none;z-index:0;opacity:.55}
.scenery svg{width:100%;height:100%;display:block}
.home>*{position:relative;z-index:1}
.mode-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px;max-width:900px;margin:0 auto;width:100%}
.mode-card:first-child{grid-column:1 / -1;justify-self:center;width:min(100%,435px)}
.mode-card{position:relative;display:grid;gap:10px;justify-items:center;align-content:center;text-align:center;padding:34px 30px 30px;color:#3a2610;text-decoration:none;border:2px solid #f3cf6e;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#fbe7ae 0,#f0cf7c 55%,#d9a849 100%);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 22px rgba(240,190,80,.35),inset 0 0 0 5px rgba(255,240,200,.35),inset 0 0 0 6px rgba(150,100,30,.45),inset 0 -8px 24px rgba(150,100,30,.25);transition:transform .18s ease,box-shadow .18s ease}
.mode-card::before,.mode-card::after{content:"";position:absolute;width:26px;height:26px;border:2px solid rgba(120,80,25,.55);pointer-events:none}
.mode-card::before{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.mode-card::after{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.home .mode-cards{max-width:680px;justify-self:center;gap:20px 24px}
.mode-card:first-child{width:min(100%,330px)}
.mode-card{padding:26px 22px 22px;gap:8px;overflow:hidden}
.mode-card h2{font-size:clamp(21px,2.4vw,26px)}
.mode-card p{font-size:14.5px}
.mode-card svg{width:46px!important;height:46px!important}
.mode-card>*{position:relative;z-index:1}
.mode-card>.tri{position:absolute;z-index:0;left:50%;top:18px;bottom:18px;height:calc(100% - 36px);width:auto;aspect-ratio:1.15;max-width:90%;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(110,70,20,.13),rgba(110,70,20,.05));transition:background .25s ease}
.mode-card:hover>.tri,.mode-card:focus-visible>.tri{background:linear-gradient(180deg,rgba(90,55,15,.3),rgba(90,55,15,.12))}
.home .lead{text-align:center;margin-top:4px}
.mode-card svg{color:#3a2610;width:56px;height:56px}
.mode-card h2{font-size:clamp(24px,3vw,32px);color:#2e1c0a}
.mode-card .orn{display:flex;align-items:center;gap:8px;width:70%;color:#6b4a1c}
.mode-card .orn::before,.mode-card .orn::after{content:"";flex:1;height:1.5px;background:currentColor;opacity:.7}
.mode-card .orn i{width:7px;height:7px;border:1.5px solid currentColor;transform:rotate(45deg)}
.mode-card p{margin:0;color:#4a3216;line-height:1.5;max-width:34ch}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 34px rgba(255,205,90,.6),inset 0 0 0 5px rgba(255,240,200,.45),inset 0 0 0 6px rgba(150,100,30,.45),inset 0 -8px 24px rgba(150,100,30,.2)}
.mode-card:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@media (max-width:640px){.mode-cards{grid-template-columns:minmax(0,1fr)}.mode-card:first-child{width:100%}}
.prac,.player{padding:34px 18px 16px}
#player,#editor{scroll-margin-top:72px}
select{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:9px 12px;max-width:100%}
.start{padding:34px 20px 22px;display:grid;gap:14px;text-align:center}
.start .lead{margin:0 auto}
.start-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.start-or{color:var(--muted)}
.pick-wrap{min-width:0;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.logo{margin:0;line-height:0}
.logo img{display:block;margin:0 auto;width:min(100%,680px);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.view .wrap.has-mini{padding-top:12px;gap:18px}
.mini-logo{display:block;justify-self:center;width:min(240px,62vw);line-height:0}
.mini-logo img{width:100%;height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.has-mini>header.top{padding-top:0}
@media (max-width:820px){.view .wrap.has-mini{padding-top:58px}}
.gpm{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,12,8,.72);backdrop-filter:blur(3px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gpm-box{border:2px solid var(--gold);border-radius:18px;background:var(--panel);padding:24px 24px 18px;display:grid;gap:16px;text-align:center;box-shadow:0 0 40px rgba(200,150,62,.25)}
.gpm-box h2{color:var(--cream);font-size:24px}
.gpm-box p{margin:0;color:var(--muted);font-size:14px}
.gpm-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gpm-item{min-width:110px;padding:14px 16px;border-radius:12px;border:1px solid var(--gold-soft);background:var(--panel-2);color:var(--cream);text-decoration:none;font-family:var(--display);font-size:18px;transition:transform .12s ease}
.gpm-item.cur{border-color:var(--gold)}
.gpm-item.on{background:var(--gold);color:var(--ink-dark);transform:scale(1.06);box-shadow:0 0 18px rgba(255,205,90,.5)}
.mode-card.gp-focus{outline:3px solid var(--cream);outline-offset:4px;transform:translateY(-3px)}
.mode-card.gp-focus>.tri{background:linear-gradient(180deg,rgba(90,55,15,.3),rgba(90,55,15,.12))}
.lv-box{width:min(100%,560px);border:2px solid var(--gold);border-radius:18px;background:var(--panel);padding:22px 20px 20px;display:grid;gap:12px;text-align:center;box-shadow:0 0 40px rgba(200,150,62,.25),0 20px 50px rgba(0,0,0,.5)}
.lv-box h2{color:var(--cream);font-size:22px}
.lv-sub{margin:0;color:var(--muted);font-size:15px}
.lv-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.lv-opt{position:relative;overflow:hidden;display:grid;gap:4px;align-content:center;justify-items:center;min-height:128px;padding:16px 10px;border:2px solid #f3cf6e;border-radius:14px;color:#2e1c0a;background:radial-gradient(ellipse at 50% 30%,#fbe7ae 0,#f0cf7c 55%,#d9a849 100%);box-shadow:0 0 0 1px rgba(90,60,20,.6),inset 0 0 0 4px rgba(255,240,200,.35),inset 0 0 0 5px rgba(150,100,30,.4);transition:transform .15s ease,box-shadow .15s ease}
.lv-opt>*{position:relative;z-index:1}
.lv-opt>.lv-ico{position:absolute;z-index:0;inset:12px;display:grid;place-items:center;color:rgba(110,70,20,.16);transition:color .25s ease}
.lv-ico svg{width:auto;height:100%;max-width:100%}
.lv-opt strong{font-family:var(--display);font-weight:400;font-size:19px}
.lv-opt small{color:#4a3216;font-size:12.5px;line-height:1.3}
.lv-opt:hover:not([disabled]),.lv-opt:focus-visible,.lv-opt.on{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 22px rgba(255,205,90,.55),inset 0 0 0 4px rgba(255,240,200,.45),inset 0 0 0 5px rgba(150,100,30,.4)}
.lv-opt:hover:not([disabled])>.lv-ico,.lv-opt:focus-visible>.lv-ico,.lv-opt.on>.lv-ico{color:rgba(90,55,15,.36)}
.lv-opt[disabled]{opacity:.55;cursor:default}
@media (max-width:480px){.lv-row{grid-template-columns:1fr}.lv-opt{min-height:88px}}
.gal-sec{display:grid;gap:12px}
.gal-sec+.gal-sec{margin-top:18px}
.gal-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:flex-start}
.gal-head h2{font-size:24px;color:var(--cream)}
.horu-d{margin-top:22px}
.horu-d>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--gold-soft);border-radius:14px;background:var(--panel)}
.horu-d>summary::-webkit-details-marker{display:none}
.horu-d>summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);transition:transform .2s ease;flex:none}
.horu-d[open]>summary::before{transform:rotate(45deg)}
.horu-d>summary h2{font-size:22px;color:var(--cream)}
.horu-d>summary:hover{border-color:var(--gold)}
.horu-d>summary:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.gal-count{color:var(--muted);font-size:14px;margin-left:auto}

.gal-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:560px;width:100%;justify-self:center}
.gal-modes>.gm{grid-column:auto!important;width:auto!important;justify-self:stretch!important}

body.land .touch-sec{display:block!important;position:fixed;inset:0;z-index:30;border:0;border-radius:0;box-shadow:none;background:var(--bg) radial-gradient(ellipse at 50% 0,#1d3a27 0,transparent 70%) no-repeat;padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.land .touch-sec>.tab,body.land .touch-sec>.hint{display:none}
body.land .touch-wrap{height:100%;display:grid;grid-template-columns:92px minmax(0,1fr) minmax(230px,290px);gap:12px;align-items:center}
body.land .joy{grid-column:1;width:84px;height:min(300px,calc(100vh - 40px));height:min(300px,calc(100dvh - 40px))}
body.land .tpad{grid-column:3;gap:6px 0}
body.land .tb.fc{width:min(72px,19vh);height:min(72px,19vh);font-size:min(30px,8vh)}
body.land .tb.sh{height:min(56px,15vh);font-size:min(28px,7.5vh)}
body.land .tb.ty,body.land .tb.ta{margin-top:-12px}
body.land #prac .prac{position:fixed;z-index:31;top:50%;transform:translateY(-50%);left:calc(118px + env(safe-area-inset-left,0px));right:calc(310px + env(safe-area-inset-right,0px));padding:8px 6px;margin:0}
body.land .land-off{display:block;padding:5px 14px;font-size:13px;border-radius:999px;background:rgba(9,19,12,.85)}
#land-rot,#land-sug{display:none}
@media (orientation:portrait){body.land #land-rot{display:grid}}
#land-rot{position:fixed;inset:0;z-index:60;place-items:center;align-content:center;gap:18px;background:var(--bg);text-align:center;color:var(--cream);padding:24px}
#land-rot p{margin:0;font-family:var(--display);font-size:21px;max-width:20ch}
#land-rot small{color:var(--muted);font-size:14px;max-width:32ch;line-height:1.45}
.rot-ico{width:130px;height:130px;color:var(--gold)}
.rot-phone{transform-origin:65px 65px;transform-box:view-box}
@media (prefers-reduced-motion:no-preference){.rot-phone{animation:rotph 2.4s ease-in-out infinite}@keyframes rotph{0%,15%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}}
@media (prefers-reduced-motion:reduce){.rot-phone{transform:rotate(-90deg)}}
#land-sug.show{display:grid}
#land-sug{position:fixed;inset:0;z-index:55;place-items:center;background:rgba(5,12,8,.78);backdrop-filter:blur(3px);padding:12px}
.sug-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;width:min(100%,620px);border:2px solid var(--gold);border-radius:16px;background:var(--panel);padding:16px 18px;box-shadow:0 0 40px rgba(200,150,62,.25)}
.sug-box h2{color:var(--cream);font-size:20px}
.sug-box p{margin:6px 0 12px;color:var(--muted);font-size:14px;line-height:1.4}
.sug-prev{width:100%;height:auto;display:block}
/* ===== Versión móvil ===== */
@media (max-width:700px), (hover:none) and (pointer:coarse){
  .touch-sec{display:grid;gap:10px;padding:30px 12px 14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #touch{margin-top:20px}
  #v-practica .pads-d{display:none}
  .land-btn{display:inline-block}
  #v-practica .prac-foot,#v-practica .prac-bar{display:none}
  #prac .pr-bar{margin:0 0 6px}
  body.land .pr-bar{display:none!important}
  .editor .ed-head>button,.editor .preview-row{display:none}
  .ed-more{display:block;position:relative;flex:0 0 auto;margin-left:auto}
  .ed-more>summary{list-style:none;cursor:pointer;padding:7px 12px;border:1px solid var(--gold-soft);border-radius:10px;background:var(--panel-2);color:var(--cream);font-size:14px;display:flex;align-items:center;gap:8px}
  .ed-more>summary::-webkit-details-marker{display:none}
  .ed-more>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg) translateY(-2px);transition:transform .2s ease}
  .ed-more[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
  .ed-more-list{position:absolute;right:0;top:calc(100% + 6px);z-index:8;display:grid;gap:6px;min-width:210px;padding:10px;border:2px solid var(--gold);border-radius:12px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .ed-more-list button{text-align:left;padding:9px 12px;font-size:14.5px}
  .ed-head input{display:none}
  .ed-bar{display:flex;gap:8px;align-items:center;margin-bottom:-4px}
  .editor>.staff-ctrls .transport,.editor>.staff-ctrls .snd,.editor>.staff-ctrls .zoom{display:none}
  .zoom-mini{display:flex;gap:6px;margin-left:auto}
  .ed-bar .zoom-mini button{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;font-size:19px;line-height:1;color:var(--gold);border-color:var(--gold-soft);background:transparent}
  .ed-bar .zoom-mini button:active{background:var(--panel-2);border-color:var(--gold)}
  .ed-bar button{padding:7px 12px;font-size:14px}
  .ed-bar .playbtn{min-width:0}
  .rec2{display:block;font-weight:700;letter-spacing:.04em;border-radius:999px}
  .ed-staff .staff-scroll{padding-bottom:14px}
  .rec2[aria-pressed="true"]{border-color:var(--danger);color:var(--danger);box-shadow:0 0 12px rgba(229,138,108,.45)}
  .ed-staff .col .nm{font-size:17px;padding:4px 9px;top:212px}
  .editor>#touch{margin-top:0}
  .editor>#touch .touch-sec{padding-top:26px}
  .editor .builder>.field,.editor .builder>.gp-row,.editor .builder>.gp-help,.editor .preview,.editor #add{display:none}
  .editor .preview-row{border-top:0;padding-top:0}
  .touch-wrap{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:center}
  .joy{position:relative;width:78px;height:250px;border-radius:40px;background:radial-gradient(ellipse at 50% 50%,#1f3828,#0f1d15);border:2px solid var(--gold-soft);touch-action:none;cursor:grab}
  .joy-track{position:absolute;left:50%;top:22px;bottom:22px;width:6px;transform:translateX(-50%);border-radius:3px;background:rgba(0,0,0,.35)}
  .joy-mid{position:absolute;left:18px;right:18px;top:50%;height:2px;background:var(--gold-soft);opacity:.6}
  .jz{position:absolute;left:50%;transform:translate(-50%,-50%);opacity:.32;transition:opacity .15s ease,transform .15s ease;line-height:0;pointer-events:none}
  .jz svg{width:32px;height:32px}
  .jz.on{opacity:1;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 6px rgba(255,220,140,.8))}
  .joy-thumb{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,#fff4da,#e9cf95 60%,#b98d43);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 -3px 0 rgba(0,0,0,.15);pointer-events:none;transition:transform .06s linear}
  .tpad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto auto auto;gap:10px 0;justify-items:center;align-items:center}
  .tb{display:grid;place-items:center;padding:0;font-family:var(--display);color:var(--ink-dark);background:var(--cream);border:2px solid #4a3216;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.45);touch-action:none;transition:transform .06s ease,filter .06s ease}
  .tb.sh{width:92%;max-width:120px;height:58px;font-size:28px;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);border-radius:10px;border:0}
  .tb.fc{width:72px;height:72px;border-radius:50%;font-size:30px}
  .tb.tl{grid-column:1 / 4;grid-row:1}
  .tb.tr{grid-column:4 / 7;grid-row:1}
  .tb.tx{grid-column:3 / 5;grid-row:2}
  .tb.ty{grid-column:1 / 4;grid-row:3;margin-top:-18px}
  .tb.ta{grid-column:4 / 7;grid-row:3;margin-top:-18px}
  .tb.down{transform:scale(.94);filter:brightness(1.12);background:#fff1cf;box-shadow:0 0 18px rgba(255,220,140,.7),inset 0 -2px 0 rgba(0,0,0,.18)}

  .guide-d{border:2px solid var(--gold);border-radius:14px;background:var(--panel)}
  .guide-d>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:11px 16px;font-family:var(--display);font-size:15px;color:var(--muted)}
  .guide-d>summary::-webkit-details-marker{display:none}
  .guide-d>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);transition:transform .2s ease}
  .guide-d[open]>summary::before{transform:rotate(45deg)}
  .guide-d .guide .frame{border:0;box-shadow:none;background:transparent;padding-top:0}
  body{font-size:15px}
  .view .wrap,.view .wrap.has-mini{padding-top:58px;gap:16px;padding-bottom:110px}
  .mini-logo{width:min(190px,56vw)}
  h1{font-size:26px}
  header.top{gap:10px}
  header.top .tools button{padding:7px 12px;font-size:14px}
  .frame{border-radius:14px}
  .tab{font-size:16px;padding:4px 16px}
  /* guía */
  .guide .frame{padding:14px 12px}
  .guide h2{font-size:17px;margin-bottom:10px}
  .g-cols{grid-template-columns:1fr;gap:14px}
  .g-cols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--gold-soft);padding-top:12px}
  .g-row{display:grid;gap:8px 4px}
  .g-cols>div:first-child .g-row{grid-template-columns:repeat(5,minmax(0,1fr))}
  .g-cols>div+div .g-row{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g-item{font-size:12px;gap:6px}
  .g-item small{font-size:10.5px;line-height:1.25}
  .k.big.face{width:42px;height:42px;font-size:21px}
  .k.big.sh{width:50px;height:35px;font-size:19px}
  .g-item svg{width:28px;height:28px}
  /* pentagramas */
  .song,.prac,.player{padding:28px 10px 12px}
  .staff-ctrls{gap:8px;margin-top:6px}
  .speed{padding:5px 10px;gap:8px;font-size:13px}
  .speed input{width:90px}
  .zoom{font-size:13px}
  .playbtn{min-width:84px}
  .prac-foot{gap:8px}
  .gp-row{font-size:13px}
  /* editor */
  .editor{padding:28px 12px 14px;gap:14px}
  .ed-head input{flex-basis:100%;font-size:19px}
  .ed-head button{padding:7px 11px;font-size:14px}
  .field{grid-template-columns:1fr;gap:6px}
  .seg{gap:6px}
  .pick{min-width:52px;min-height:52px;padding:4px}
  .preview-row{gap:10px}
  .preview-row .actions{width:100%}
  .preview-row .actions button{flex:1 1 auto;padding:9px 10px;font-size:14px}
  .gp-help{font-size:13px;padding:6px 12px}
  /* práctica */
  .pad-row{gap:8px}
  .pad{min-width:0;flex:1 1 0;padding:10px 4px}
  .pad .k.big.face{width:40px;height:40px}
  .pad .k.big.sh{width:46px;height:33px}
  .hint{font-size:13px}
  /* canciones */
  .gallery{gap:16px}
  .card-body h3{font-size:18px}
  .card .actions button{padding:7px 11px;font-size:14px}
  /* inicio */
  .hero{padding-top:6px}
  .mode-card{padding:22px 18px 18px}
  .home .lead{font-size:14px}
  /* barra de guardado y avisos */
  .savebar{font-size:14px;gap:8px;padding-top:10px}
  .lv-box{padding:18px 14px 14px}
  .lv-opt{min-height:78px}
  .gpm-item{min-width:0;flex:1 1 40%;font-size:16px;padding:12px}
}

@media (max-width:700px), (hover:none) and (pointer:coarse){
  #gal-list .grp>summary{display:grid;grid-template-columns:auto minmax(0,max-content) 1fr;column-gap:10px;row-gap:6px;align-items:center}
  #gal-list .grp>summary::before{grid-row:1;grid-column:1}
  #gal-list .grp>summary .grp-thumbs{grid-row:1;grid-column:3;justify-self:start}
  #gal-list .grp>summary .grp-name{grid-row:1;grid-column:2;min-width:0;overflow-wrap:anywhere}
  #gal-list .grp>summary .gal-count{grid-row:2;grid-column:2 / -1;margin-left:0}
  #gal-list .grp>summary .grp-act{grid-row:3;grid-column:2 / -1;margin-left:0}
}

@media (max-width:700px), (hover:none) and (pointer:coarse){
  .player .staff-ctrls .transport,.player .staff-ctrls .snd,.player .staff-ctrls .zoom{display:none}
  .pl-bar{margin:4px 0 2px}
  .pl-head{gap:8px}
  .pl-head .meta{flex:1 1 100%;order:-1;font-size:13px}
  .pl-head .pl-img{display:none}
  .pl-head button{padding:6px 11px;font-size:13.5px}
  .gd-bar .gd-prog{font-size:17px}
  #prac .gd-bar [data-act="gd-restart"]{display:none}
  #prac .gd-bar .gd-meter{order:3;flex-basis:100%}
  #prac .gd-bar .actions button{padding:4px 10px;font-size:12.5px}
  body.land .gd-bar .actions,body.land .gd-hint{display:none}
  body.land .gd-bar{margin:0 0 2px}
}

@media (max-width:700px), (hover:none) and (pointer:coarse){
  .staff-ctrls .vol{display:none}
}

.only-mob{display:none}
@media (max-width:700px), (hover:none) and (pointer:coarse){
  .only-desk{display:none}.only-mob{display:inline}
  .touch-wrap{max-width:560px;width:100%;margin:0 auto}
  body.land .touch-wrap{max-width:none}
}

function dpad(dir){
  var P={up:[17,7],left:[7,17],right:[27,17],down:[17,27]},s='';
  for(var k in P){var p=P[k];s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.6" class="'+(k===dir?'ic-on':'ic-ring')+'"/>'}
  var c=P[dir];var tri=dir==='up'?(c[0]+','+(c[1]-3.2)+' '+(c[0]-3)+','+(c[1]+2.2)+' '+(c[0]+3)+','+(c[1]+2.2)):(c[0]+','+(c[1]+3.2)+' '+(c[0]-3)+','+(c[1]-2.2)+' '+(c[0]+3)+','+(c[1]-2.2));

function combo(code){
  var cb=COMBOS[code];if(!cb)return'';var up=cb[1]==='up';
  if(cb[1]==='b1'||cb[1]==='b2'){
    var tb=cb[0]+' '+CLABEL[cb[1]];
    var paths=['M17 34 Q30 33 30.5 21'];if(cb[1]==='b2')paths.push('M12 30 Q24 29.5 24.5 22');
    var pb='';paths.forEach(function(d){pb+='<path class="ic-bend-o" d="'+d+'"/>'});paths.forEach(function(d){pb+='<path class="ic-bend" d="'+d+'"/>'});
    return '<svg width="38" height="38" viewBox="0 0 38 38" role="img" aria-label="'+tb+'"><title>'+tb+'</title><circle class="ic-key" cx="14" cy="13" r="11"/><text class="ic-letter" x="14" y="17.5" text-anchor="middle">'+cb[0]+'</text>'+pb+'<polygon class="ic-arrow" points="30.5,13 36,22 25,22"/></svg>';

}

function staffHTML(notes,edit,sid,mk){
  var lines='';for(var p=0;p<=8;p+=2)lines+='<span class="ln" style="top:'+(TOP+(8-p)*STEP-1.5)+'px"></span>';
  var cols=notes.map(function(n,i){
    var rm=edit?'<button class="rm" data-rm="'+i+'" aria-label="Quitar">×</button>':'';
    if(n.sep)return '<span class="bar phr" title="Fin de frase">'+rm+'</span>';
    if(n.bar)return '<span class="bar" title="Barra de compás">'+rm+'</span>';
    var p=POS[n.b]==null?2:POS[n.b];var half=(n.b==='L'||n.b==='R')?15:18;
    var led=p<=-2?'<span class="ledger" style="top:'+y(-2)+'"></span>':'';
    var m=mods(n);
    return '<span class="col'+(mk?' '+mk(i):'')+'" title="'+esc(desc(n))+'">'+led+(m?'<span class="mods" style="top:calc('+y(p)+' - '+(half+4)+'px)">'+m+'</span>':'')+'<span class="k '+((n.b==='L'||n.b==='R')?'sh':'face')+'" style="top:'+y(p)+'">'+esc(n.b)+'</span><span class="nm">'+noteName(n)+'</span>'+rm+'</span>';
  }).join('');

}
