<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Horu's Ocarina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Music&family=Spectral:wght@400;600;700&display=swap">
<style id="app-style">
/* Layout: paneles marrón oscuro con marco dorado; cada canción es un pentagrama donde la altura del botón indica la nota */
:root{
  --bg:#0e1a12; --panel:#13241a; --panel-2:#1a2e21;
  --hi:#244531; --hi2:#1f3828; --glow:#21402c; --glow2:#1d3a27; --deep:#09130c; --deep2:#0f1d15; --deep-rgb:9,19,12; --shade-rgb:5,12,8;
  --sc-mtn:#183022; --sc-mtn2:#22402c; --sc-town:#132519; --sc-h1:#102017; --sc-h2:#0c1811; --sc-fog:#0a140d; --gold:#c8963e; --gold-soft:#8a6730;
  --cream:#f6ead1; --ink-dark:#2a1a0f; --text:#f1e4c8; --muted:#bfa983; --line:#6b5338; --danger:#e58a6c;
  --display:"Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Spectral", Georgia, "Times New Roman", serif;
  --staff-bg:var(--panel);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg) radial-gradient(ellipse at 50% -10%,var(--glow) 0,transparent 60%) no-repeat;color:var(--text);font-family:var(--body);font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 120px;display:grid;gap:26px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.frame{position:relative;border:2px solid var(--gold);border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px rgba(200,150,62,.25)}
.tab{position:absolute;top:0;left:50%;transform:translate(-50%,-55%);background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:5px 22px;font-family:var(--display);font-size:clamp(17px,2.6vw,22px);white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
.tab::before,.tab::after{content:"";position:absolute;top:50%;width:9px;height:9px;border:2px solid var(--gold);background:var(--bg);transform:translateY(-50%) rotate(45deg)}
.tab::before{left:-7px}.tab::after{right:-7px}

header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-top:12px}
h1{font-size:clamp(28px,5vw,42px);color:var(--cream)}
.tools{display:flex;flex-wrap:wrap;gap:10px}
input[type=search],input[type=text]{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:9px 12px;min-width:0}
input::placeholder{color:var(--muted)}
button{font:inherit;font-size:15px;cursor:pointer;color:var(--cream);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
button.primary{background:var(--gold);color:var(--ink-dark);border-color:var(--gold);font-weight:700}
button.danger{color:var(--danger)}

/* Guía */
.guide-d>summary{display:none}
.guide{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.guide .frame{padding:20px 22px}
.guide h2{font-size:21px;color:var(--cream);margin-bottom:14px}
.g-cols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px}
@media (min-width:900px){.g-cols{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}.g-row{flex-wrap:nowrap;gap:0}.g-row>.g-item{flex:1 1 0;min-width:0}}
.g-cols>div+div{border-left:1px solid var(--gold-soft);padding-left:22px}
.g-row{display:flex;flex-wrap:wrap;gap:16px 18px}
.g-item{display:grid;justify-items:center;gap:8px;text-align:center;font-size:14px;color:var(--text)}
.g-item small{display:block;color:var(--muted);font-size:12.5px}
.howto p{margin:0;line-height:1.55;color:var(--text);max-width:42ch}
@media (max-width:860px){.guide{grid-template-columns:1fr}}
@media (max-width:560px){.g-cols{grid-template-columns:1fr}.g-cols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--gold-soft);padding-top:18px}}

/* Iconos */
.k{display:grid;place-items:center;background:var(--cream);color:var(--ink-dark);font-family:var(--display);font-size:22px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.45)}
.k.face{width:44px;height:44px;border-radius:50%}
.k.sh{width:52px;height:38px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);border-radius:6px}
.k.big.face{width:56px;height:56px;font-size:28px}
.k.big.sh{width:66px;height:46px;font-size:26px}
.ic-ring{fill:none;stroke:var(--cream);stroke-width:2}
.ic-on{fill:var(--cream)}
.ic-tri{fill:var(--ink-dark)}
.ic-key{fill:var(--cream);stroke:var(--ink-dark);stroke-width:1}
.ic-letter{fill:var(--ink-dark);font-family:var(--display);font-size:13px}
.ic-bend-o{fill:none;stroke:var(--ink-dark);stroke-width:5.4;stroke-linecap:round}
.ic-bend{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round}
.ic-arrow{fill:var(--cream);stroke:var(--ink-dark);stroke-width:1.2;stroke-linejoin:round}

/* Pentagrama */
.songs{display:grid;gap:36px}
.song{padding:34px 18px 16px}
.song-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tag{color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:0 7px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.staffs{display:grid;gap:14px}
.staff-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.staff{position:relative;height:262px;min-width:100%;width:max-content;padding:0 30vw 0 0}
.clef{position:relative;flex:none;width:76px;height:100%;pointer-events:none}
.clef svg{display:block;overflow:visible}
.col,.bar{z-index:1}
.clef .cl-ln{stroke:var(--line);stroke-width:3}
.clef .cl-g{fill:var(--cream);font-family:"Noto Music","Bravura","Segoe UI Symbol","Apple Symbols",serif;font-size:112px}
.ledger{position:absolute;left:50%;transform:translate(-50%,-50%);width:66px;height:3px;border-radius:2px;background:var(--line)}
.speed{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 12px;border:1px solid var(--gold-soft);border-radius:10px;background:var(--panel-2)}
.speed input{accent-color:var(--gold);width:120px}
.speed{padding:4px 6px 4px 12px;gap:6px}
.speed button{padding:2px 10px;font-size:17px;line-height:1.2}
.corner{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,calc(env(safe-area-inset-left,0px) + 12px));display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ver{color:var(--gold)!important;font-family:var(--display);font-size:12px!important;letter-spacing:.06em;opacity:.85;padding:1px 3px!important;background:none!important;border:0!important;box-shadow:none!important;min-width:0!important;cursor:pointer;text-decoration:underline dotted rgba(200,150,62,.5);text-underline-offset:3px}
.ver:hover{opacity:1;color:var(--cream)!important}
body.land .corner{display:none}
.bg-mini{display:flex;gap:6px}
@media (max-width:700px), (hover:none) and (pointer:coarse){.corner{top:calc(env(safe-area-inset-top,0px) + 54px)}#v-home .hero{margin-top:40px}}
.bg-mini .bg-sw{padding:2px!important}
.bg-mini .bg-sw i{width:20px;height:20px;border-width:1.5px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)}
.bg-mini .bg-sw[aria-pressed="true"] i{box-shadow:inset 0 0 0 2px rgba(0,0,0,.28),0 0 0 2px rgba(200,150,62,.45),0 0 8px rgba(200,150,62,.4)}
.vol{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--gold-soft);border-radius:10px;background:var(--panel-2)}
.vol button{padding:2px 10px;font-size:17px;line-height:1.2}
.vol .snd{display:grid;place-items:center;padding:3px 7px;border:0;background:transparent;color:var(--gold)}
.vol .snd[aria-pressed="false"]{color:var(--muted)}
.vol output{color:var(--cream);min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.speed output{min-width:9ch;text-align:center}
.speed output{color:var(--cream);font-variant-numeric:tabular-nums;min-width:7ch}
.staff .ln{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line) 4%,var(--line) 96%,transparent)}
.notes{position:relative;display:flex;gap:10px;height:100%;align-items:stretch}
.col{position:relative;width:52px;flex:none}
.col .nm{position:absolute;top:214px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:14px;line-height:1;color:var(--muted);padding:4px 8px;border:1px solid rgba(138,103,48,.55);border-radius:6px;background:rgba(0,0,0,.18);opacity:.85;transition:color .2s ease,border-color .2s ease,opacity .2s ease;pointer-events:none}
.col.on .nm{color:var(--cream);border-color:var(--gold);opacity:1}
.col .k.face{width:35px;height:35px;font-size:18px}
.col .k.sh{width:42px;height:30px;font-size:17px}
.col .mods svg{width:29px;height:29px}
.col .mods{gap:1px}
.col .k{position:absolute;left:50%;transform:translate(-50%,-50%)}
.col .mods{position:absolute;left:50%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.col .rm{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:24px;height:24px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--danger)}
.bar.phr{width:8px;background:linear-gradient(90deg,var(--gold-soft) 0 2px,transparent 2px 4px,var(--gold) 4px 8px)}
.bar{width:2px;flex:none;align-self:flex-start;height:118px;margin-top:67px;background:var(--gold-soft);border-radius:2px;position:relative}
.bar .rm{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);width:24px;height:24px;padding:0;border-radius:50%;font-size:15px;line-height:1;display:grid;place-items:center;color:var(--danger)}
.empty{color:var(--muted);font-style:italic;margin:6px 0}

/* Editor */
.editor{padding:34px 20px 20px;border-width:3px;display:grid;gap:18px}
.ed-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-head input{flex:1 1 220px;font-family:var(--display);font-size:22px}
.ed-staff{--staff-bg:var(--panel-2);background:var(--panel-2);border-radius:12px;padding:6px 0 30px}
.builder{display:grid;gap:14px}
.field{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.lbl{font-family:var(--display);color:var(--muted);font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{display:grid;place-items:center;min-width:58px;min-height:58px;padding:6px;border-radius:12px;background:var(--panel-2)}
.pick[aria-pressed="true"]{border-color:var(--cream);background:var(--hi);box-shadow:0 0 0 2px var(--gold)}
.pick .k{transform:scale(.82)}
.pick small{font-size:12px;color:var(--muted)}
.preview-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--gold-soft);padding-top:16px}
.preview{display:flex;align-items:center;gap:12px;color:var(--muted)}
.pv{position:relative;width:62px;height:104px}
.pv .k{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}
.pv .mods{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.modes{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));display:flex;gap:2px;padding:4px;border:1px solid var(--gold-soft);border-radius:999px;background:rgba(var(--deep-rgb),.88);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.modes a{color:var(--muted);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.modes a:hover{color:var(--cream)}
.modes a[aria-current="page"]{background:var(--gold);color:var(--ink-dark);font-weight:700}
.modes a:focus-visible,.mode-card:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.view .wrap{padding-top:64px}
.hero{display:grid;gap:10px;text-align:center;padding-top:20px}
.hero h1{font-size:clamp(32px,6vw,54px)}
.lead{margin:0 auto;color:var(--muted);max-width:56ch;line-height:1.5}
.home{position:relative}
.scenery{position:fixed;left:0;right:0;bottom:0;height:46vh;pointer-events:none;z-index:0;opacity:.55}
.scenery svg{width:100%;height:100%;display:block}
.home>*{position:relative;z-index:1}
.mode-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px;max-width:900px;margin:0 auto;width:100%}
.mode-card:first-child{grid-column:1 / -1;justify-self:center;width:min(100%,435px)}
.mode-card{position:relative;display:grid;gap:10px;justify-items:center;align-content:center;text-align:center;padding:34px 30px 30px;color:#3a2610;text-decoration:none;border:2px solid #f3cf6e;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#fbe7ae 0,#f0cf7c 55%,#d9a849 100%);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 22px rgba(240,190,80,.35),inset 0 0 0 5px rgba(255,240,200,.35),inset 0 0 0 6px rgba(150,100,30,.45),inset 0 -8px 24px rgba(150,100,30,.25);transition:transform .18s ease,box-shadow .18s ease}
.mode-card::before,.mode-card::after{content:"";position:absolute;width:26px;height:26px;border:2px solid rgba(120,80,25,.55);pointer-events:none}
.mode-card::before{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.mode-card::after{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.home .mode-cards{max-width:680px;justify-self:center;gap:20px 24px}
.mode-card:first-child{width:min(100%,330px)}
.mode-card{padding:26px 22px 22px;gap:8px;overflow:hidden}
.mode-card h2{font-size:clamp(21px,2.4vw,26px)}
.mode-card p{font-size:14.5px}
.mode-card svg{width:46px!important;height:46px!important}
.mode-card>*{position:relative;z-index:1}
.mode-card>.tri{position:absolute;z-index:0;left:50%;top:18px;bottom:18px;height:calc(100% - 36px);width:auto;aspect-ratio:1.15;max-width:90%;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(110,70,20,.13),rgba(110,70,20,.05));transition:background .25s ease}
.mode-card:hover>.tri,.mode-card:focus-visible>.tri{background:linear-gradient(180deg,rgba(90,55,15,.3),rgba(90,55,15,.12))}
.home .lead{text-align:center;margin-top:4px}
.mode-card svg{color:#3a2610;width:56px;height:56px}
.mode-card h2{font-size:clamp(24px,3vw,32px);color:#2e1c0a}
.mode-card .orn{display:flex;align-items:center;gap:8px;width:70%;color:#6b4a1c}
.mode-card .orn::before,.mode-card .orn::after{content:"";flex:1;height:1.5px;background:currentColor;opacity:.7}
.mode-card .orn i{width:7px;height:7px;border:1.5px solid currentColor;transform:rotate(45deg)}
.mode-card p{margin:0;color:#4a3216;line-height:1.5;max-width:34ch}
.mode-card:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 34px rgba(255,205,90,.6),inset 0 0 0 5px rgba(255,240,200,.45),inset 0 0 0 6px rgba(150,100,30,.45),inset 0 -8px 24px rgba(150,100,30,.2)}
.mode-card:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@media (max-width:640px){.mode-cards{grid-template-columns:minmax(0,1fr)}.mode-card:first-child{width:100%}}
.prac,.player{padding:34px 18px 16px}
#player,#editor{scroll-margin-top:72px}
select{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--gold-soft);border-radius:10px;padding:9px 12px;max-width:100%}
.start{padding:34px 20px 22px;display:grid;gap:14px;text-align:center}
.start .lead{margin:0 auto}
.start-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.start-or{color:var(--muted)}
.pick-wrap{min-width:0;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.logo{margin:0;line-height:0}
.logo img{display:block;margin:0 auto;width:min(100%,680px);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.view .wrap.has-mini{padding-top:12px;gap:18px}
.mini-logo{display:block;justify-self:center;width:min(240px,62vw);line-height:0}
.mini-logo img{width:100%;height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.has-mini>header.top{padding-top:0}
@media (max-width:820px){.view .wrap.has-mini{padding-top:58px}}
.gpm{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(var(--shade-rgb),.72);backdrop-filter:blur(3px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gpm-box{border:2px solid var(--gold);border-radius:18px;background:var(--panel);padding:24px 24px 18px;display:grid;gap:16px;text-align:center;box-shadow:0 0 40px rgba(200,150,62,.25)}
.gpm-box h2{color:var(--cream);font-size:24px}
.gpm-box p{margin:0;color:var(--muted);font-size:14px}
.gpm-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gpm-item{min-width:110px;padding:14px 16px;border-radius:12px;border:1px solid var(--gold-soft);background:var(--panel-2);color:var(--cream);text-decoration:none;font-family:var(--display);font-size:18px;transition:transform .12s ease}
.gpm-item.cur{border-color:var(--gold)}
.gpm-item.on{background:var(--gold);color:var(--ink-dark);transform:scale(1.06);box-shadow:0 0 18px rgba(255,205,90,.5)}
.mode-card.gp-focus{outline:3px solid var(--cream);outline-offset:4px;transform:translateY(-3px)}
.mode-card.gp-focus>.tri{background:linear-gradient(180deg,rgba(90,55,15,.3),rgba(90,55,15,.12))}
.lv-box{width:min(100%,560px);border:2px solid var(--gold);border-radius:18px;background:var(--panel);padding:22px 20px 20px;display:grid;gap:12px;text-align:center;box-shadow:0 0 40px rgba(200,150,62,.25),0 20px 50px rgba(0,0,0,.5)}
.lv-box h2{color:var(--cream);font-size:22px}
.lv-sub{margin:0;color:var(--muted);font-size:15px}
.lv-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.lv-opt{position:relative;overflow:hidden;display:grid;gap:4px;align-content:center;justify-items:center;min-height:128px;padding:16px 10px;border:2px solid #f3cf6e;border-radius:14px;color:#2e1c0a;background:radial-gradient(ellipse at 50% 30%,#fbe7ae 0,#f0cf7c 55%,#d9a849 100%);box-shadow:0 0 0 1px rgba(90,60,20,.6),inset 0 0 0 4px rgba(255,240,200,.35),inset 0 0 0 5px rgba(150,100,30,.4);transition:transform .15s ease,box-shadow .15s ease}
.lv-opt>*{position:relative;z-index:1}
.lv-opt>.lv-ico{position:absolute;z-index:0;inset:12px;display:grid;place-items:center;color:rgba(110,70,20,.16);transition:color .25s ease}
.lv-ico svg{width:auto;height:100%;max-width:100%}
.lv-opt strong{font-family:var(--display);font-weight:400;font-size:19px}
.lv-opt small{color:#4a3216;font-size:12.5px;line-height:1.3}
.lv-opt:hover:not([disabled]),.lv-opt:focus-visible,.lv-opt.on{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(90,60,20,.6),0 0 22px rgba(255,205,90,.55),inset 0 0 0 4px rgba(255,240,200,.45),inset 0 0 0 5px rgba(150,100,30,.4)}
.lv-opt:hover:not([disabled])>.lv-ico,.lv-opt:focus-visible>.lv-ico,.lv-opt.on>.lv-ico{color:rgba(90,55,15,.36)}
.lv-opt[disabled]{opacity:.55;cursor:default}

.bg-pick{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;margin:18px auto 0;color:var(--muted);font-size:15px}
.bg-pick .lbl-bg{width:100%;text-align:center;font-family:var(--display);color:var(--muted);letter-spacing:.04em}
.bg-sw{display:flex!important;flex-direction:column;align-items:center;gap:6px;background:none!important;border:0!important;box-shadow:none!important;padding:2px 4px!important;color:var(--muted)!important;font-size:14px;cursor:pointer;min-width:0!important}
.bg-sw i{display:block;width:42px;height:42px;border-radius:50%;border:2px solid var(--gold-soft);box-shadow:inset 0 0 0 3px rgba(0,0,0,.28);transition:transform .15s ease,box-shadow .15s ease}
.bg-sw:hover i{transform:scale(1.06)}
.bg-sw[aria-pressed="true"]{color:var(--cream)!important}
.bg-sw[aria-pressed="true"] i{border-color:var(--gold);box-shadow:inset 0 0 0 3px rgba(0,0,0,.28),0 0 0 3px rgba(200,150,62,.35),0 0 16px rgba(200,150,62,.35)}
.bg-sw:focus-visible i{outline:2px solid var(--cream);outline-offset:3px}

/* Inicio en el móvil: fichas compactas en horizontal */
@media (max-width:700px), (hover:none) and (pointer:coarse){
  #v-home .mode-cards{gap:12px;max-width:360px;margin:0 auto}
  #v-home .mode-card,#v-home .mode-card:first-child{width:100%;grid-template-columns:42px minmax(0,1fr);justify-items:start;align-items:center;text-align:left;column-gap:14px;row-gap:3px;padding:14px 18px 14px 16px;border-radius:14px;border-width:1.5px}
  #v-home .mode-card svg{grid-column:1;grid-row:1 / span 2;align-self:center;width:36px!important;height:36px!important}
  #v-home .mode-card h2{grid-column:2;font-size:20px;line-height:1.15;align-self:end}
  #v-home .mode-card .orn{display:none}
  #v-home .mode-card p{grid-column:2;font-size:12.5px;line-height:1.38;align-self:start;max-width:none}
  #v-home .mode-card::before,#v-home .mode-card::after{width:15px;height:15px;border-width:1.5px}
  #v-home .mode-card::before{top:6px;left:6px;border-radius:7px 0 0 0}
  #v-home .mode-card::after{bottom:6px;right:6px;border-radius:0 0 7px 0}
  #v-home .mode-card>.tri{left:6px;transform:none;top:12px;bottom:12px;height:calc(100% - 24px);max-width:60px}
  #v-home .lead{font-size:13.5px;margin-top:4px}
}

/* Canción completa en varias líneas */
.staff-wrap{display:grid;gap:2px}
.staff-wrap .staff-scroll{overflow:hidden}
.staff-wrap .staff{padding-right:0;height:246px;margin-top:-34px}
.staff-wrap .noclef .clef{display:none}
.staff-wrap .noclef .notes{padding-left:14px}
.staff-wrap .staff-scroll+.staff-scroll{border-top:1px dashed rgba(200,150,62,.22)}
.pl-wrap[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* Novedades */
.news-box{width:min(100%,600px);max-height:min(86vh,760px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
.news-body{overflow-y:auto;padding-right:6px;display:grid;gap:14px;text-align:left}
.news-body h3{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--gold)}
.news-body ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--text);font-size:14.5px;line-height:1.45}
.news-body li::marker{color:var(--gold)}

var PC={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11},BTNM={L:62,R:65,A:69,Y:71,X:74};
function bestFor(m,pref){
  var best=null;
  ['L','R','A','Y','X'].forEach(function(b){
    [0,1,-1].forEach(function(d){[0,2,-2].forEach(function(c){
      if(BTNM[b]+d+c!==m)return;var cost=(d?1:0)+(c?2:0);if(pref&&(d+c)*pref<0)cost+=0.5;
      if(!best||cost<best.cost)best={b:b,d:d,c:c,cost:cost};
    })});
  });
  if(!best)return null;var n={b:best.b};if(best.d===1)n.d='up';if(best.d===-1)n.d='down';if(best.c===2)n.c='Lup';if(best.c===-2)n.c='Ldown';return n;
}
function convertText(txt){
  var lines=String(txt||'').split(/\r?\n/),name='',notes=[],bad=[];
  var re=/(do|re|mi|fa|sol|la|si)\s*([#♯]|[♭]|b(?![a-záéíóúñ]))?\s*(')?\s*(alto|alta|agudo|aguda|bajo|baja|grave)?/gi;
  lines.forEach(function(line){
    var l=line.trim();if(!l)return;
    if(/:\s*$/.test(l)&&!name){name=l.replace(/:\s*$/,'').trim();return}
    var m,count=0;re.lastIndex=0;
    while((m=re.exec(l))){
      var before=l.slice(0,m.index);if(m.index>0&&/[a-záéíóúñ]$/i.test(before))continue;
      count++;var midi=60+PC[m[1].toLowerCase()];
      if(m[2]){midi+=(/[#♯]/.test(m[2])?1:-1)}
      if(m[3])midi+=12;
      if(m[4]){midi+=(/^(alt|agud)/i.test(m[4])?12:-12)}
      while(midi<59)midi+=12;while(midi>77)midi-=12;
      var n=bestFor(midi,m[2]?(/[#♯]/.test(m[2])?1:-1):0);if(n)notes.push(n);else bad.push(m[0].trim());
    }
    if(count&&notes.length&&!notes[notes.length-1].sep)notes.push({sep:1});
  });
  if(notes.length&&notes[notes.length-1].sep)notes.pop();
  return {name:name||'Canción convertida',notes:notes,bad:bad};
}

  if(t.dataset.hl!=null){var hn4=st.hum.notes[+t.dataset.hl];if(hn4)hn4.brk=!hn4.brk;renderBeta();return}
  if(t.id==='hum-use'){st.beta.text=humText();var r0=convertText(st.beta.text);st.beta.bad=r0.bad;st.beta.msg='';st.beta.song=r0.notes.length?{id:uid(),name:r0.name,notes:r0.notes}:null;renderBeta();var bx=document.querySelector('#beta .beta-box:not(.hum-box)');if(bx)bx.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.id==='bt-go'){var tx=document.getElementById('bt-text');st.beta.text=tx?tx.value:'';var r=convertText(st.beta.text);st.beta.bad=r.bad;st.beta.msg='';st.beta.song=r.notes.length?{id:uid(),name:r.name,notes:r.notes}:null;if(!r.notes.length)st.beta.msg='No he encontrado notas.';renderBeta();return}
  if(t.id==='bt-clear'){st.beta={text:'',song:null,msg:''};renderBeta();var ta=document.getElementById('bt-text');if(ta)ta.focus();return}
  if(t.id==='bt-save'||t.id==='bt-edit'){var bs=st.beta.song;if(!bs)return;var nmI=document.getElementById('bt-name');var copy={id:uid(),name:(nmI&&nmI.value.trim())||bs.name,notes:JSON.parse(JSON.stringify(bs.notes))};songs.unshift(copy);persist();
    if(t.id==='bt-edit'){st.sel=copy.id;ss.set('oc-sel',copy.id);location.hash='#crear'}else{st.beta.msg='Guardada en «Mis canciones». Recuerda pulsar «Guardar cambios».';renderBeta()}return}
  if(t.id==='prac-clear'){if(st.guide){restartGuide();return}prac.notes=[];renderPractice();return}
  if(t.dataset.fav){var fid=t.dataset.fav;toggleFav(fid);toast(isFav(fid)?'Añadida a favoritas':'Quitada de favoritas');renderGalList();renderPlayer();return}
  if(t.dataset.open){st.open=t.dataset.open;markRecent(st.open);renderPlayer();renderGallery();var pl=document.getElementById('player');if(pl)pl.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.id==='pl-wrap'){var wasP=st.play&&st.play.id;stopPlay();if(wasP&&st.resume)delete st.resume[wasP];st.wrapView=!st.wrapView;ls.set('oc-wrap',st.wrapView?'1':null);renderPlayer();var plw=document.getElementById('player');if(plw&&st.wrapView)plw.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.id==='pl-close'){stopPlay();st.open=null;renderPlayer();renderGallery();return}
  if(t.dataset.photo){st.photoFor=t.dataset.photo;document.getElementById('img-file').click();return}
  if(t.dataset.rmphoto){for(var ri=0;ri<songs.length;ri++)if(songs[ri].id===t.dataset.rmphoto)delete songs[ri].img;persist();renderGallery();renderPlayer();return}
  if(t.dataset.restart){var rk=t.dataset.restart,was=st.play&&st.play.id===rk;stopPlay();if(st.resume)delete st.resume[rk];var rs=document.querySelector('[data-scroll="'+rk+'"]');if(rs)rs.scrollLeft=0;if(was){var pb=document.querySelector('[data-play="'+rk+'"]');if(pb)startPlay(rk,pb)}return}
  if(t.dataset.play){if(st.play&&st.play.id===t.dataset.play)stopPlay();else startPlay(t.dataset.play,t);return}
  if(t.dataset.edit){select(t.dataset.edit===st.sel?null:t.dataset.edit);return}
  if(t.id==='close'){select(null);return}
  if(t.id==='recover'){songs=draft.songs;draft=null;st.dirty=true;renderAll();return}
  if(t.id==='discard'){draft=null;ls.set('oc-draft2',null);renderBanner();return}
  if(t.id==='save'){if(needName())askName(function(){save()});else save();return}
  if(!s)return;
  if(t.dataset.b){st.b=t.dataset.b;renderEditor();return}
  if(t.dataset.d!==undefined){st.d=t.dataset.d||null;renderEditor();return}
  if(t.dataset.c!==undefined){st.c=t.dataset.c||null;renderEditor();return}
  if(t.id==='rec'||t.id==='rec2'){st.rec=!st.rec;recLast=null;renderEditor();return}
  if(t.id==='add'){var nn={b:st.b};if(st.d)nn.d=st.d;if(st.c)nn.c=st.c;if(st.rec&&ptrLen!=null){var pnow=performance.now()-ptrLen;nn.dt=recLast==null?0:Math.round(pnow-recLast);recLast=pnow;nn.len=ptrLen}ptrLen=null;s.notes.push(nn);s.example=false;st.follow=true;st.d=null;st.c=null;changed();return}
  if(t.id==='sep'){addMark('sep');return}
  if(t.id==='bar'){addMark('bar');return}
  if(t.id==='undo'){if(s.notes.length){s.notes.pop();changed()}return}
  if(t.id==='undo2'){histGo(-1);return}
  if(t.id==='redo'){histGo(1);return}
  if(t.id==='paste-end'){st.erange=null;st.esel=null;selInsertAt(s.notes.length,st.clip);return}
  if(t.id==='tr-open'){st.trOpen=!st.trOpen;st.trMsg='';renderEditor();return}
  if(t.dataset.tr!==undefined){var tk=+t.dataset.tr;if(!tk){st.trOpen=false;st.trMsg='';renderEditor();return}doTranspose(tk);return}
  if(t.id==='fixrec'){var fc=fixSongFromRec(s);st.dirty=fc>0||st.dirty;if(fc){stash();renderSave()}st.fixMsg=fc?('He corregido '+fc+(fc===1?' nota':' notas')+' para que coincidan con lo que sonó al grabar.'):'Todas las notas ya coincidían con la grabación.';renderEditor();return}
  if(t.dataset.es){var ea=t.dataset.es;if(ea==='close'){st.esel=null;st.erange=null;st.rangeMode=false;st.insMode=false;renderEditor()}else if(ea==='play'){var pr3=selRange();if(pr3&&pr3[1]>pr3[0])playSeq(s.notes.slice(pr3[0],pr3[1]+1));else playNote(s.notes[st.esel],0.5)}
    else if(ea==='range'){st.rangeMode=!st.rangeMode;st.insMode=false;renderEditor()}else if(ea==='copy'){selCopy()}else if(ea==='cut'){if(selCopy())selDelete()}else if(ea==='paste'){selPaste()}else if(ea==='dup'){selDup()}else if(ea==='left'){selMove(-1)}else if(ea==='right'){selMove(1)}else if(ea==='tr'){st.trOpen=true;st.trMsg='';renderEditor()}else if(ea==='del'&&st.erange){selDelete()}else if(ea==='before')esInsert(false);else if(ea==='after')esInsert(true);else if(ea==='ins'){st.insMode=!st.insMode;st.rangeMode=false;renderEditor()}else if(ea==='del'){s.notes.splice(st.esel,1);if(st.esel>=s.notes.length)st.esel=s.notes.length?s.notes.length-1:null;while(st.esel!=null&&st.esel>0&&!s.notes[st.esel].b)st.esel--;if(st.esel!=null&&!(s.notes[st.esel]||{}).b)st.esel=null;changed()}return}
  if(t.dataset.esB){var vb=t.dataset.esB;esChange(function(n){n.b=vb});return}
  if(t.dataset.esD!==undefined){var vd=t.dataset.esD;esChange(function(n){if(vd)n.d=vd;else delete n.d;delete n.cv});return}
  if(t.dataset.esC!==undefined){var vc=t.dataset.esC;esChange(function(n){if(vc)n.c=vc;else delete n.c;delete n.cv});return}
  if(t.dataset.rm!==undefined){s.notes.splice(+t.dataset.rm,1);changed();return}
  if(t.id==='clear'){if(!s.notes.length)return;if(!st.confirmClear){st.confirmClear=true;renderEditor();return}s.notes=[];st.confirmClear=false;changed();return}
  if(t.id!=='clear'&&st.confirmClear){st.confirmClear=false}
  if(t.id==='del'){if(!st.confirmDel){st.confirmDel=true;renderEditor();return}songs=songs.filter(function(x){return x.id!==s.id});st.sel=null;ss.set('oc-sel',null);st.confirmDel=false;changed();return}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='gal-q'){st.gq=ev.target.value;renderGalList();return}
  if(ev.target.id==='q'){stopPlay();st.q=ev.target.value;renderList()}
  if(ev.target.classList&&ev.target.classList.contains('spd')){speed=parseFloat(ev.target.value)||2;var so=document.querySelectorAll('.spd-out'),sr=document.querySelectorAll('.spd');for(var q=0;q<so.length;q++)so[q].textContent=fmtSpeed();for(q=0;q<sr.length;q++)if(sr[q]!==ev.target)sr[q].value=speed;try{localStorage.setItem('oc-speed',String(speed))}catch(e){}}
  if(ev.target.id==='song-name'){var s=cur();if(s){s.name=ev.target.value;s.example=false;st.dirty=true;stash();renderList();renderSave()}}
});

function buildDoc(){
  var json=JSON.stringify(songs).replace(/</g,'\\u003c');
  var parts=[document.querySelector('title'),document.querySelector('meta[name="claude:viewport-fit-sides"]'),document.querySelector('link[href*="fonts.googleapis"]'),document.getElementById('app-style')].map(function(e){return e?e.outerHTML:''}).join('');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+parts+'<main id="app"></main><script type="application/json" id="catalog-data">'+json+'<\/script>'+document.getElementById('app-script').outerHTML+'</body></html>';
}
function save(){
  if(st.role==='personal'){
    if(st.saving)return;st.saving=true;renderSave();
    savePersonal().then(function(){st.saving=false;st.dirty=false;st.msg='';st.personalSnap=JSON.stringify(songs);renderSave();renderGallery();renderPlayer();var af=ss.get('oc-after');if(af!=null){ss.set('oc-after',null);st.sel=null;ss.set('oc-sel',null);goMode(af)}},
      function(e){st.saving=false;st.msg=(e&&e.code==='quota_exceeded')?'No queda espacio para guardar. Quita alguna foto o canción':'No se pudo guardar. Inténtalo de nuevo';renderSave()});
    return;
  }
  if(!st.api||st.saving)return;st.saving=true;renderSave();ls.set('oc-draft2',null);
  st.api.publish(buildDoc()).catch(function(e){
    st.saving=false;var c=e&&e.code;if(c==='conflict')return;stash();
    var deny=(c==='not_granted'||c==='not_writer');
    st.msg=deny?'No tienes permiso para guardar este cancionero':'No se pudo guardar. Inténtalo de nuevo';
    if(deny)st.api=null;renderSave();
  });
}
var inCode=hashToCode(String(location.hash||'').replace('#',''));
if(inCode){st.pendingLink=inCode;try{history.replaceState(null,'','#canciones')}catch(e){location.hash='#canciones'}}
renderAll();
var after=ss.get('oc-after');if(after!=null){ss.set('oc-after',null);st.sel=null;if(modeFromHash()!==after){st.skipHash=true;location.hash=after?'#'+after:'#'}setMode(after)}else setMode(modeFromHash());
requestAnimationFrame(gpLoop);
maybeNews();
if(st.sel&&!songs.some(function(x){return x.id===st.sel})){st.sel=null;ss.set('oc-sel',null);renderEditor()}
detectRole();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(a){st.api=a||null;renderSave()},function(){st.api=null;renderSave()})}else{st.api=null;renderSave()}
})();
